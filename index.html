        <!-- Surbhi(header and hero) -->

        <section id="hero" class="hero-section">

            <!-- Header / Navbar -->
            <header class="navbar">
        
              <!-- Logo -->
              <div class="logo">
                <img src="assets/logo.svg" alt="Street Sight Logo" />
              </div>
        
              <!-- Menu -->
              <div class="nav-container">
                <nav class="nav-links">
                  <ul>
                    <li><a href="#hero" class="active">Home</a></li>
                    <li><a href="#about-us">About</a></li>

                    <li><a href="#team">Team</a></li>

                  </ul>
                </nav>
              </div>
            
              <!-- Right side group -->
              <div class="right-group">
                <div class="login-btn">
                  <button>Log in</button>
                </div>
                <div class="hamburger" id="hamburger" onclick="toggleMenu()">
                    <span></span>
                  <span></span>
                  <span></span>
                </div>
              </div>
            </header>
        
            <!-- Hero Text Content -->
            <div class="hero-content">
              <h1><span class="highlight">Less Hassle, More Dazzle</span></h1>
              <h2>The Ultimate Billboard CRM</h2>
              <p><i>Street Sight</i> is an all-in-one billboard management CRM that simplifies the way you manage billboards, assign clients, track campaigns, and analyze performance — all in one place.</p>
              
              <button class="cta-button">Start Free Trial</button>
              <div class="scroll-cue">↓</div>
            </div>
        
          </section>
        
          <!-- JavaScript to toggle nav -->
          <script>
            function toggleMenu() {
              const navLinks = document.querySelector('.nav-links');
              const hamburger = document.getElementById('hamburger');
              navLinks.classList.toggle('show');
              hamburger.classList.toggle('active');
            }
          </script>
